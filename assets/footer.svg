<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Parlons-en. Un projet, une alternance, une idée ?">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .f { opacity: 0; animation: up .8s cubic-bezier(.22, 1, .36, 1) forwards; }
    .d1 { animation-delay: .05s } .d2 { animation-delay: .2s }
    @keyframes up { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
    @media (prefers-reduced-motion: reduce) { .f { animation: none; opacity: 1 } }
  </style>
  <rect width="1200" height="240" rx="28" fill="#1D1D1F"/>
  <text class="f d1" x="600" y="124" text-anchor="middle" font-size="72" font-weight="700" letter-spacing="-2" fill="#F5F5F7">Parlons-en.</text>
  <text class="f d2" x="600" y="176" text-anchor="middle" font-size="23" font-weight="500" fill="#AAAAAA">Un projet, une alternance, une idée ?</text>
</svg>
