<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Parlons-en. Un projet, une alternance, une idée ?">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#2997FF"/>
      <stop offset=".5" stop-color="#BF5AF2"/>
      <stop offset="1" stop-color="#FF375F"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;-0.6 0;0 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .f { opacity: 0; animation: up 1s cubic-bezier(.22, 1, .36, 1) forwards; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .3s }
    @keyframes up { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }
    @media (prefers-reduced-motion: reduce) { .f { animation: none; opacity: 1 } }
  </style>
  <rect width="1200" height="260" rx="32" fill="#000"/>
  <text class="f d1" x="600" y="132" text-anchor="middle" font-size="76" font-weight="700" letter-spacing="-2.2" fill="url(#g)">Parlons-en.</text>
  <text class="f d2" x="600" y="188" text-anchor="middle" font-size="24" font-weight="500" fill="#A1A1A6">Un projet, une alternance, une idée ?</text>
</svg>
