<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="Mes IA au quotidien. Code : Claude Code, CodeRabbit, Gemini. Réflexion : Claude, ChatGPT. Création : Midjourney, Figma, Canva. Production : Gamma, Notion AI, Descript.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .t { opacity: 0; animation: up .8s cubic-bezier(.22, 1, .36, 1) forwards; }
    .c1 { animation-delay: .05s } .c2 { animation-delay: .15s } .c3 { animation-delay: .25s } .c4 { animation-delay: .35s }
    @keyframes up { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    @media (prefers-reduced-motion: reduce) { .t { animation: none; opacity: 1 } }
    .col { fill: #2C2C2E; }
    .cat { font-size: 15px; font-weight: 600; letter-spacing: 1px; fill: #F5F5F7; }
    .name { font-size: 26px; font-weight: 700; letter-spacing: -.5px; fill: #F5F5F7; }
    .use { font-size: 16px; font-weight: 500; fill: #AAAAAA; }
    .rule { stroke: #3A3A3C; stroke-width: 1; }
  </style>

  <rect width="1200" height="390" rx="28" fill="#1D1D1F"/>

  <!-- Code -->
  <g class="t c1">
    <rect class="col" x="20" y="20" width="275" height="350" rx="22"/>
    <rect x="48" y="54" width="12" height="12" rx="3" fill="#30D158"/><text class="cat" x="70" y="66">CODE</text>
    <text class="name" x="48" y="124">Claude Code</text><text class="use" x="48" y="150">Développement</text>
    <line class="rule" x1="48" y1="178" x2="267" y2="178"/>
    <text class="name" x="48" y="222">CodeRabbit</text><text class="use" x="48" y="248">Revue de code</text>
    <line class="rule" x1="48" y1="276" x2="267" y2="276"/>
    <text class="name" x="48" y="320">Gemini</text><text class="use" x="48" y="346">IA dans mes applis</text>
  </g>

  <!-- Réflexion -->
  <g class="t c2">
    <rect class="col" x="315" y="20" width="275" height="350" rx="22"/>
    <rect x="343" y="54" width="12" height="12" rx="3" fill="#FFD60A"/><text class="cat" x="365" y="66">RÉFLEXION</text>
    <text class="name" x="343" y="124">Claude</text><text class="use" x="343" y="150">Analyse &amp; rédaction</text>
    <line class="rule" x1="343" y1="178" x2="562" y2="178"/>
    <text class="name" x="343" y="222">ChatGPT</text><text class="use" x="343" y="248">Recherche &amp; idées</text>
  </g>

  <!-- Création -->
  <g class="t c3">
    <rect class="col" x="610" y="20" width="275" height="350" rx="22"/>
    <rect x="638" y="54" width="12" height="12" rx="3" fill="#FF453A"/><text class="cat" x="660" y="66">CRÉATION</text>
    <text class="name" x="638" y="124">Midjourney</text><text class="use" x="638" y="150">Création d’images</text>
    <line class="rule" x1="638" y1="178" x2="857" y2="178"/>
    <text class="name" x="638" y="222">Figma</text><text class="use" x="638" y="248">Design d’interfaces</text>
    <line class="rule" x1="638" y1="276" x2="857" y2="276"/>
    <text class="name" x="638" y="320">Canva</text><text class="use" x="638" y="346">Visuels</text>
  </g>

  <!-- Production -->
  <g class="t c4">
    <rect class="col" x="905" y="20" width="275" height="350" rx="22"/>
    <rect x="933" y="54" width="12" height="12" rx="3" fill="#30D158"/><text class="cat" x="955" y="66">PRODUCTION</text>
    <text class="name" x="933" y="124">Gamma</text><text class="use" x="933" y="150">Présentations</text>
    <line class="rule" x1="933" y1="178" x2="1152" y2="178"/>
    <text class="name" x="933" y="222">Notion AI</text><text class="use" x="933" y="248">Organisation</text>
    <line class="rule" x1="933" y1="276" x2="1152" y2="276"/>
    <text class="name" x="933" y="320">Descript</text><text class="use" x="933" y="346">Montage vidéo</text>
  </g>
</svg>
