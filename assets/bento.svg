<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Développement : de la base de données au dernier pixel. Alternance RH et paie. L'IA, mon coéquipier. Hors écran : gamer et passionné de mode.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .t { opacity: 0; animation: up .8s cubic-bezier(.22, 1, .36, 1) forwards; }
    .a { animation-delay: .05s } .b { animation-delay: .15s } .c { animation-delay: .25s } .d { animation-delay: .35s }
    @keyframes up { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    @media (prefers-reduced-motion: reduce) { .t { animation: none; opacity: 1 } }
    .tile { fill: #2C2C2E; }
    .label { font-size: 15px; font-weight: 600; letter-spacing: 1px; fill: #8E8E93; }
    .big { font-size: 42px; font-weight: 700; letter-spacing: -1.1px; fill: #F5F5F7; }
    .green { fill: #30D158; } .red { fill: #FF453A; } .mark { fill: #FFD60A; }
    .small { font-size: 17px; font-weight: 500; fill: #AAAAAA; }
  </style>

  <rect width="1200" height="620" rx="28" fill="#1D1D1F"/>

  <!-- Développement -->
  <g class="t a">
    <rect class="tile" x="20" y="20" width="700" height="280" rx="22"/>
    <text class="label" x="60" y="72">DÉVELOPPEMENT</text>
    <text class="big" x="60" y="150">De la base de données</text>
    <text class="big green" x="60" y="200">au dernier pixel.</text>
    <text class="small" x="60" y="260">React · TypeScript · Node · Prisma · PostgreSQL · Temps réel</text>
  </g>

  <!-- RH & Paie -->
  <g class="t b">
    <rect class="tile" x="740" y="20" width="440" height="280" rx="22"/>
    <text class="label" x="780" y="72">ALTERNANCE</text>
    <text class="big" x="780" y="150" style="font-size:56px">RH &amp;</text>
    <text class="big red" x="780" y="208" style="font-size:56px">Paie.</text>
    <text class="small" x="780" y="260">Je vis la paie de l’intérieur.</text>
  </g>

  <!-- IA -->
  <g class="t c">
    <rect class="tile" x="20" y="320" width="440" height="280" rx="22"/>
    <text class="label" x="60" y="372">INTELLIGENCE ARTIFICIELLE</text>
    <text class="big" x="60" y="450">L’IA, mon</text>
    <rect class="mark" x="52" y="463" width="232" height="50" rx="6"/><text class="big" x="60" y="500" style="fill:#1D1D1F">coéquipier.</text>
    <text class="small" x="60" y="560">Onze outils au quotidien, détaillés plus bas.</text>
  </g>

  <!-- Hors écran -->
  <g class="t d">
    <rect class="tile" x="480" y="320" width="700" height="280" rx="22"/>
    <text class="label" x="520" y="372">HORS ÉCRAN</text>
    <text class="big" x="520" y="450">Gamer.</text>
    <text class="big green" x="520" y="500">Passionné de mode.</text>
    <text class="small" x="520" y="560">Bien fait &gt; vite fait. Idéalement les deux.</text>
  </g>
</svg>
