<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Développement : de la base de données au dernier pixel. Alternance RH et paie. L'IA, mon coéquipier. Hors écran : gamer et passionné de mode.">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2997FF"/><stop offset="1" stop-color="#5AC8FA"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF9F0A"/><stop offset="1" stop-color="#FF375F"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#BF5AF2"/><stop offset="1" stop-color="#2997FF"/></linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .t { opacity: 0; animation: up 1s cubic-bezier(.22, 1, .36, 1) forwards; }
    .a { animation-delay: .15s } .b { animation-delay: .3s } .c { animation-delay: .45s } .d { animation-delay: .6s }
    @keyframes up { from { opacity: 0; transform: translateY(24px) } to { opacity: 1; transform: none } }
    @media (prefers-reduced-motion: reduce) { .t { animation: none; opacity: 1 } }
    .tile { fill: #1C1C1E; }
    .label { font-size: 17px; font-weight: 600; fill: #86868B; }
    .big { font-size: 44px; font-weight: 700; letter-spacing: -1.2px; fill: #F5F5F7; }
    .small { font-size: 17px; font-weight: 500; fill: #86868B; }
  </style>

  <rect width="1200" height="640" rx="32" fill="#000"/>

  <!-- Développement -->
  <g class="t a">
    <rect class="tile" x="20" y="20" width="700" height="290" rx="26"/>
    <text class="label" x="60" y="76">Développement</text>
    <text class="big" x="60" y="156">De la base de données</text>
    <text class="big" x="60" y="208" style="fill:url(#blue)">au dernier pixel.</text>
    <text class="small" x="60" y="270">React · TypeScript · Node · Prisma · PostgreSQL · Temps réel</text>
  </g>

  <!-- RH & Paie -->
  <g class="t b">
    <rect class="tile" x="740" y="20" width="440" height="290" rx="26"/>
    <text class="label" x="780" y="76">Alternance</text>
    <text class="big" x="780" y="156" style="font-size:58px">RH &amp;</text>
    <text class="big" x="780" y="216" style="font-size:58px;fill:url(#warm)">Paie.</text>
    <text class="small" x="780" y="270">Je vis la paie de l’intérieur.</text>
  </g>

  <!-- IA -->
  <g class="t c">
    <rect class="tile" x="20" y="330" width="440" height="290" rx="26"/>
    <text class="label" x="60" y="386">Intelligence artificielle</text>
    <text class="big" x="60" y="466">L’IA, mon</text>
    <text class="big" x="60" y="518" style="fill:url(#violet)">coéquipier.</text>
    <text class="small" x="60" y="580">Claude Code · Claude · CodeRabbit · Gemini</text>
  </g>

  <!-- Hors écran -->
  <g class="t d">
    <rect class="tile" x="480" y="330" width="700" height="290" rx="26"/>
    <text class="label" x="520" y="386">Hors écran</text>
    <text class="big" x="520" y="466">Gamer.</text>
    <text class="big" x="520" y="518" style="fill:url(#warm)">Passionné de mode.</text>
    <text class="small" x="520" y="580">Bien fait &gt; vite fait. Idéalement les deux.</text>
    <text x="1140" y="500" text-anchor="end" font-size="76">🎮👟</text>
  </g>
</svg>
