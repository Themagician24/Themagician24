name: Snake
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Themagician24
          outputs: |
            dist/github-snake.svg?color_snake=#007AFF&color_dots=#ebebed,#cce4ff,#80bcff,#3395ff,#007AFF
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#007AFF&color_dots=#161b22,#0a2a4d,#00478f,#0062cc,#007AFF
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
