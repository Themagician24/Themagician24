name: Snake
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Themagician24
          outputs: |
            dist/github-snake.svg?color_snake=#2997FF&color_dots=#ebedf0,#c6e0ff,#7ab8ff,#2997FF,#0058b0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#2997FF&color_dots=#161b22,#0b2a4a,#0d4a85,#1673d1,#2997FF
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
