name: Snake
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Themagician24
          outputs: |
            dist/github-snake.svg?color_snake=#FF453A&color_dots=#ebedf0,#b7e4c3,#6fcf8a,#34b55c,#30D158
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF453A&color_dots=#161b22,#0f3d1e,#16632f,#1c8a40,#30D158
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
