name: Vidéo aléatoire
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/random-video.mjs
      - name: Commit si la vidéo a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore: nouvelle vidéo aléatoire" && git push)
